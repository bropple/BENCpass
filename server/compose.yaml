# Local development: `docker compose up --build`.
#
# For TrueNAS use truenas-app.yaml instead — it pulls a published image rather
# than building, which is what the Custom App screen supports.

name: bencpass-dev

services:
  bencpass:
    build:
      context: .
      args:
        VERSION: dev
    image: bencpass-server:dev
    restart: unless-stopped

    # Whoever owns ./data locally, rather than the 568 the image defaults to.
    user: "${UID:-1000}:${GID:-1000}"

    ports:
      - "127.0.0.1:8788:8788"

    volumes:
      - ./data:/data

    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
