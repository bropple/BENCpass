<!doctype html>
<meta charset="utf-8">
<title>BENCpass</title>
<link rel="stylesheet" href="toast.css">
<div class="toast">

    <p class="text" id="text">…</p>
    <label class="name" id="name-row" hidden>

      <button class="btn" id="dismiss">Not now</button>

  </div>
</div>
<script type="module" src="toast.js"></script>
