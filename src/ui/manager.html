<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BENCpass</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- The gate covers everything until the vault is open. There is no route
     around it: the app pane holds no plaintext until manager.js puts it there. -->
<div id="gate" class="gate">
  <div class="gate-panel">
    <svg class="gon" id="gon" viewBox="0 0 200 200" aria-hidden="true">
      <path d="M 100,16 L 179.89,74.04 L 149.37,167.96 L 50.63,167.96 L 20.11,74.04 Z"
            fill="var(--accent)" stroke="var(--accent-edge)" stroke-width="2"/>
      <rect x="53.8" y="95.8" width="92.4" height="28.56" fill="#9a9d94"/>
      <!-- The visor stripe is the lock indicator: red locked, green open. -->
      <rect id="visor" x="70.6" y="103.36" width="58.8" height="13.44" fill="var(--bad)"/>
    </svg>

    <h1 class="wordmark">BENCPASS</h1>

    <!-- When a fingerprint is enrolled it comes first and is asked for on
         sight; the password form below is put away until it is wanted. -->
    <div id="gate-bio-panel" hidden>
      <p class="gate-hint" id="gate-bio-text"></p>
      <button type="button" class="btn btn-primary gate-bio" id="gate-bio">Unlock</button>
      <button type="button" class="btn-link" id="gate-use-password">Use master password</button>
    </div>

    <form id="gate-form" autocomplete="off">
      <p class="gate-hint" id="gate-hint">Locked.</p>

      <label class="field">
        <span class="label">Master password</span>
        <input type="password" id="gate-pw" autocomplete="current-password" required>
      </label>

      <label class="field" id="gate-confirm-field" hidden>
        <span class="label">Confirm</span>
        <input type="password" id="gate-pw2" autocomplete="new-password">
      </label>

      <p class="gate-error" id="gate-error" role="alert" hidden></p>

      <button type="submit" class="btn btn-primary" id="gate-go">Unlock</button>
    </form>

    <p class="gate-note" id="gate-note"></p>
  </div>
</div>

<!-- ------------------------------------------------------------------ -->

<div id="app" class="app" hidden>
  <header class="bar">
    <svg class="gon gon-sm" viewBox="0 0 200 200" aria-hidden="true">
      <path d="M 100,16 L 179.89,74.04 L 149.37,167.96 L 50.63,167.96 L 20.11,74.04 Z"
            fill="var(--accent)" stroke="var(--accent-edge)" stroke-width="3"/>
      <rect x="53.8" y="95.8" width="92.4" height="28.56" fill="#9a9d94"/>
      <rect x="70.6" y="103.36" width="58.8" height="13.44" fill="var(--good)"/>
    </svg>
    <span class="bar-mark">BENCPASS</span>

    <!-- Logins and addresses are different kinds of thing that happen to share
         a vault. Mixing them in one list makes both harder to scan. -->
    <div class="seg" id="sections" role="tablist">
      <button class="seg-btn" data-section="login" role="tab" aria-selected="true">Logins</button>
      <button class="seg-btn" data-section="address" role="tab" aria-selected="false">Addresses</button>
    </div>

    <input type="search" id="search" class="search" placeholder="Search" autocomplete="off">

    <span class="bar-spacer"></span>
    <span class="bar-status" id="status" aria-live="polite"></span>
    <button class="btn" id="new-btn">New</button>
    <!-- Drawn rather than loaded: one more file to keep in step is not worth it
         for one shape, and an <img> would need the icon in
         web_accessible_resources.

         A filled cog, not spokes around a circle. The first attempt was eight
         evenly spaced lines radiating from a ring, which is a drawing of the
         sun — teeth have width and sit flush against the body, and that is the
         whole difference. -->
    <button class="btn btn-icon" id="settings-btn" title="Settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" fill="currentColor">
        <path d="M20.3 13.6a8.6 8.6 0 0 0 0-3.2l2-1.5-2-3.5-2.4 1a8.4 8.4 0 0 0-2.7-1.6L14.8 2
                 h-4l-.4 2.8a8.4 8.4 0 0 0-2.7 1.6l-2.4-1-2 3.5 2 1.5a8.6 8.6 0 0 0 0 3.2l-2 1.5
                 2 3.5 2.4-1a8.4 8.4 0 0 0 2.7 1.6l.4 2.8h4l.4-2.8a8.4 8.4 0 0 0 2.7-1.6l2.4 1
                 2-3.5-2-1.5ZM12 15.4A3.4 3.4 0 1 1 12 8.6a3.4 3.4 0 0 1 0 6.8Z"/>
      </svg>
    </button>
    <button class="btn" id="lock-btn">Lock</button>
  </header>

  <main class="split">
    <nav class="list-pane">
      <ol class="list" id="list"></ol>
      <p class="empty" id="list-empty" hidden>No entries.</p>
    </nav>

    <section class="detail-pane" id="detail">
      <p class="empty" id="detail-empty">Nothing selected.</p>

      <article class="detail" id="detail-view" hidden>
        <h2 class="detail-title" id="d-title"></h2>

        <!-- Address rows are built in JS from the record's own keys, so the
             field list lives in one place rather than two. -->
        <div id="d-address" hidden></div>

        <div id="d-login">
        <div class="row">
          <span class="label">Username</span>
          <span class="value" id="d-username"></span>
          <button class="btn btn-sm" data-copy="username">Copy</button>
        </div>

        <div class="row">
          <span class="label">Password</span>
          <span class="value mono secret" id="d-password"></span>
          <button class="btn btn-sm" id="reveal-btn">Reveal</button>
          <button class="btn btn-sm" data-copy="password">Copy</button>
        </div>

        <div class="row" id="d-urls-row">
          <span class="label">URLs</span>
          <span class="value" id="d-urls"></span>
        </div>

        <div class="row" id="d-notes-row">
          <span class="label">Notes</span>
          <span class="value wrap" id="d-notes"></span>
        </div>
        </div>

        <hr class="rule">

        <dl class="meta" id="d-meta"></dl>

        <div class="detail-actions">
          <button class="btn" id="edit-btn">Edit</button>
          <button class="btn btn-danger" id="delete-btn">Delete</button>
        </div>
      </article>

      <!-- ---- edit form ---- -->
      <form class="detail edit" id="edit-form" hidden autocomplete="off">
        <h2 class="detail-title" id="edit-heading">New entry</h2>

        <label class="field">
          <span class="label">Title</span>
          <input type="text" id="e-title" required>
        </label>

        <div id="e-address" hidden></div>

        <div id="e-login">
        <label class="field">
          <span class="label">Username</span>
          <input type="text" id="e-username" autocomplete="off">
        </label>

        <div class="field">
          <label class="label" for="e-password">Password</label>
          <div class="input-row">
            <!-- Masked by default like the viewer. Generating unmasks it, since
                 the point of generating is to see what you got. -->
            <input type="password" id="e-password" class="mono" autocomplete="off">
            <button type="button" class="btn btn-sm" id="e-reveal-btn">Show</button>
          </div>
        </div>

        <div class="gen">
          <div class="gen-controls">
            <label class="chk"><input type="checkbox" id="g-lower" checked> a-z</label>
            <label class="chk"><input type="checkbox" id="g-upper" checked> A-Z</label>
            <label class="chk"><input type="checkbox" id="g-digits" checked> 0-9</label>
            <label class="chk"><input type="checkbox" id="g-symbols" checked> !#$</label>
            <label class="chk"><input type="checkbox" id="g-ambig"> no Il1O0</label>
            <label class="len">
              <input type="range" id="g-length" min="8" max="64" value="20">
              <output id="g-length-out">20</output>
            </label>
            <button type="button" class="btn btn-sm" id="gen-btn">Generate</button>
          </div>
          <p class="gen-entropy" id="g-entropy"></p>
        </div>

        <label class="field">
          <span class="label">URLs</span>
          <input type="text" id="e-urls" placeholder="one per line, or comma separated">
        </label>
        </div>

        <label class="field">
          <span class="label">Notes</span>
          <textarea id="e-notes" rows="4"></textarea>
        </label>

        <div class="detail-actions">
          <button type="submit" class="btn btn-primary">Save</button>
          <button type="button" class="btn" id="cancel-btn">Cancel</button>
        </div>
      </form>
    </section>
  </main>

  <!-- Settings. A pane over the split rather than a separate page, so leaving
       it puts you back exactly where you were. -->
  <section class="settings" id="settings" hidden>
    <div class="settings-inner">
      <header class="settings-head">
        <h2>Settings</h2>
        <button class="btn" id="settings-close">Done</button>
      </header>

      <h3 class="settings-group">Unlocking</h3>

      <div class="setting">
        <div class="setting-text">
          <span class="setting-name" id="s-bio-name">Biometric unlock</span>
          <span class="setting-note" id="s-bio-note"></span>

          <!-- Asked for here rather than through window.prompt(), which draws a
               browser dialog with a *plain text* box — a master password in
               clear view of the room, and a synchronous modal in a panel that
               is not reliably allowed to draw one. -->
          <form class="bio-confirm" id="s-bio-form" hidden autocomplete="off">
            <label class="label" for="s-bio-pw">Master password</label>
            <div class="input-row">
              <input type="password" id="s-bio-pw" autocomplete="current-password" required>
              <button type="submit" class="btn btn-sm btn-primary">Confirm</button>
              <button type="button" class="btn btn-sm" id="s-bio-cancel">Cancel</button>
            </div>
            <p class="setting-note" id="s-bio-error"></p>
          </form>
        </div>
        <button class="btn btn-sm" id="s-bio-btn" hidden></button>
      </div>

      <label class="setting">
        <div class="setting-text">
          <span class="setting-name">Lock after</span>
          <span class="setting-note">Minutes of inactivity before the vault shuts.</span>
        </div>
        <input type="number" id="s-autolock" min="1" max="1440" class="setting-input">
      </label>

      <h3 class="settings-group">Sync</h3>

      <label class="setting">
        <div class="setting-text">
          <span class="setting-name">Server</span>
          <span class="setting-note">
            Tried first. https, or plain http to a private address — a LAN name
            cannot hold a certificate.
          </span>
        </div>
        <input type="text" id="s-endpoint" class="setting-input wide"
               placeholder="http://192.168.1.20:8788">
      </label>

      <label class="setting">
        <div class="setting-text">
          <span class="setting-name">Also reachable at</span>
          <span class="setting-note">
            The <em>same</em> server by another route — a Tailscale name for when
            you are not at home. Used only when the first cannot be reached at
            all; a server that answers with a refusal is not retried here.
            Two <em>different</em> servers would be two vaults taking turns.
          </span>
        </div>
        <input type="text" id="s-fallback" class="setting-input wide"
               placeholder="https://bencpass.your-tailnet.ts.net">
      </label>

      <label class="setting">
        <div class="setting-text">
          <span class="setting-name">Enrollment code</span>
          <span class="setting-note" id="s-enrol-note"></span>
        </div>
        <input type="text" id="s-enrolment" class="setting-input wide"
               placeholder="device-id:key" autocomplete="off">
      </label>

      <div class="setting">
        <div class="setting-text">
          <span class="setting-name">Sync now</span>
          <span class="setting-note" id="s-sync-note"></span>
        </div>
        <button class="btn btn-sm" id="s-sync-btn">Sync</button>
      </div>

      <h3 class="settings-group">Filling</h3>

      <label class="setting">
        <div class="setting-text">
          <span class="setting-name">Fill on insecure pages</span>
          <span class="setting-note">
            Off by default. A password sent over plain http to a public site is
            readable by anything on the way; private addresses are already
            exempt without this.
          </span>
        </div>
        <input type="checkbox" id="s-insecure" class="setting-check">
      </label>

      <h3 class="settings-group">About</h3>
      <dl class="meta" id="s-about"></dl>

      <p class="settings-error" id="s-error" role="alert" hidden></p>
    </div>
  </section>

  <footer class="foot">
    <span id="foot-count"></span>
    <span class="bar-spacer"></span>
    <span id="foot-lock"></span>
  </footer>
</div>

<script type="module" src="manager.js"></script>
</body>
</html>
