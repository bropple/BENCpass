name: Release

# Cutting a release: build the extension, have Mozilla sign it, and attach the
# signed .xpi to a GitHub Release.
#
# Signing is not optional. Release Firefox refuses to install an extension
# Mozilla has not signed and offers no way to override it, so an unsigned build
# is only ever installable through about:debugging, temporarily, until the
# browser restarts. The `.zip` CI produces on every push is for testing; this is
# the thing a person installs.
#
# Runs on a v* tag and nothing else. Tag, and this does the rest:
#
#   node tools/check-version.mjs 0.12.0
#   git commit -am "Release 0.12.0" && git tag v0.12.0
#   git push && git push --tags

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Read by default. The publishing job asks for more, and the three rescue build
# jobs — which run a toolchain over a large dependency tree — get nothing they
# do not need.
permissions:
  contents: read

jobs:
  # The rescue tool ships with the release rather than separately. Somebody who
  # needs it needs it on a day they cannot install anything, so the binary they
  # want has to already be next to the .xpi they installed months earlier.
  rescue:
    name: Rescue tool (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
            binary: bencpass-rescue
            archive: tar
          - os: macos-latest
            name: macOS
            binary: bencpass-rescue
            archive: tar
          - os: windows-latest
            name: Windows
            binary: bencpass-rescue.exe
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.6'
          cache: false

      - name: Toolkit dependencies
        if: matrix.os == 'ubuntu-latest'
        run: tools/linux-gui-deps.sh

      - name: Build
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          flags="-s -w -X main.Version=${version}"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            flags="$flags -H=windowsgui"
          fi
          go build -trimpath -ldflags "$flags" -o "build/${{ matrix.binary }}" .
        working-directory: rescue

      # The version it reports has to be the tag being released. A binary that
      # says "dev" in a release archive is a bug report filed against nothing.
      - name: It reports the release version
        shell: bash
        run: |
          got=$(./build/${{ matrix.binary }} -version)
          echo "$got"
          case "$got" in
            *"${GITHUB_REF_NAME#v}"*) ;;
            *) echo "::error::built binary reports: $got"; exit 1 ;;
          esac
        working-directory: rescue

      - name: It opens a vault
        shell: bash
        run: |
          printf '%s' 'correct horse battery staple' \
            | ./build/${{ matrix.binary }} -list internal/vault/testdata/backup.json \
            | grep -q '3 record(s)'
        working-directory: rescue

      - name: Package
        shell: bash
        run: |
          cd rescue/build
          name="bencpass-rescue-${GITHUB_REF_NAME}-${{ matrix.name }}"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "${name}.zip" "${{ matrix.binary }}"
          else
            tar czf "${name}.tar.gz" "${{ matrix.binary }}"
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rescue-${{ matrix.name }}
          path: |
            rescue/build/*.tar.gz
            rescue/build/*.zip
          if-no-files-found: error

  release:
    name: Build, sign, publish
    needs: rescue
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload the .xpi
      id-token: write # sign the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, so `git describe` can find the previous tag. The
          # default shallow checkout has no HEAD^ at all, which made the release
          # notes range below a silent no-op on every run rather than only the
          # first.
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Fail here rather than after a five-minute build, with a sentence that
      # says what to do about it.
      - name: The signing credentials are present
        env:
          ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if [ -z "$ISSUER" ] || [ -z "$SECRET" ]; then
            echo "::error::AMO_JWT_ISSUER and AMO_JWT_SECRET are not set."
            echo "Get them from addons.mozilla.org -> Developer Hub -> Manage API Keys,"
            echo "then: gh secret set AMO_JWT_ISSUER && gh secret set AMO_JWT_SECRET"
            exit 1
          fi

      # A tag that disagrees with the manifest produces a release whose file is
      # named one thing and whose contents say another, and AMO will not let the
      # version be reused once it is spent.
      - name: The tag matches the manifest
        run: |
          node tools/check-version.mjs
          manifest=$(node -p "require('./src/manifest.json').version")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$manifest" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME says $tag, manifest says $manifest"
            echo "Run: node tools/check-version.mjs $tag"
            exit 1
          fi

      # The full suite, again, on the exact commit being released. CI has
      # already run it — but CI runs on a branch and this runs on a tag, and the
      # thing being signed is worth ten seconds of certainty.
      - name: Tests
        run: npm test

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.6'
          cache: false

      - name: Server tests
        run: go test ./...
        working-directory: server

      - name: Lint the extension
        run: npx web-ext lint --source-dir=src --self-hosted

      # `sign` builds as well as signs, and returns the signed artefact. The
      # unlisted channel means Mozilla signs it and hands it back rather than
      # publishing it on the store — self-distribution, which is what a
      # self-hosted password manager wants.
      #
      # Note for the first submission: AMO asks for buildable sources when a
      # package contains generated or minified code. src/vendor/argon2.js is a
      # minified bundle, and tools/vendor.sh is the recipe that produces it from
      # the pinned lockfile.
      - name: Sign
        env:
          # Through the environment rather than the command line. GitHub masks
          # both either way; this keeps them out of the process arguments too,
          # which is the one place on the runner they would otherwise be visible.
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          npx web-ext sign \
            --source-dir=src \
            --artifacts-dir=build/ext \
            --channel=unlisted

      - name: Find what came back
        run: |
          xpi=$(find build/ext -name '*.xpi' | head -1)
          if [ -z "$xpi" ]; then
            echo "::error::signing produced no .xpi"
            ls -la build/ext || true
            exit 1
          fi
          echo "xpi=$xpi" >> "$GITHUB_ENV"
          echo "signed: $xpi"

      - name: Collect the rescue binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: rescue-*
          path: build/rescue
          merge-multiple: true

      # The .xpi arrives with Mozilla's signature on it. The rescue binaries
      # arrive with nothing, and they are the ones a person pipes their master
      # password into. Anyone who can edit a release — a leaked token, a
      # compromised account — could otherwise swap one for a trojan and nobody
      # downstream could tell.
      #
      # Checksums so a download can be checked against the release page, and an
      # attestation so it can be checked against *this workflow run and commit*
      # instead, which is the part a checksum sitting beside the file cannot do.
      - name: Checksums
        run: |
          cd build/rescue
          sha256sum ./* > SHA256SUMS
          cat SHA256SUMS

      - name: Attest what built these
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: 'build/rescue/*.tar.gz,build/rescue/*.zip'

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$xpi" build/rescue/* \
            --title "BENCpass $GITHUB_REF_NAME" \
            --generate-notes \
            --notes-start-tag "$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo '')"

      # Kept for the same reason the build is kept on every CI run: if the
      # release step fails after signing, the signed file is not lost and does
      # not have to be bought with another version number.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: bencpass-signed
          path: build/ext/*.xpi
          if-no-files-found: warn
