name: Security

# Everything here answers a question that changes over time even when the code
# does not: a dependency turns out to be vulnerable, a vendored list goes stale,
# an advisory lands against the Go toolchain. A password manager that was clean
# on the day it shipped and never looked again is only accurate as history.
#
# Runs on every push and pull request, and on a schedule for exactly the reason
# above — the interesting failures arrive without anybody touching the repo.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays, early. Nothing here is urgent enough for daily noise, and a week
    # is short enough that an advisory is still news when it surfaces.
    - cron: '17 6 * * 1'
  workflow_dispatch:

# Read-only by default. Individual jobs ask for more only where they must, and
# CodeQL is the only one that needs to write anything.
permissions:
  contents: read

jobs:
  go-vulns:
    name: Go dependencies and toolchain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.6'
          cache: false

      # govulncheck reports only vulnerabilities on paths the code actually
      # reaches, so a finding here is a finding rather than an inventory entry.
      # It covers the standard library too, which matters: the server's whole
      # attack surface is net/http and crypto.
      - name: govulncheck
        run: |
          # Pinned. @latest in a job that checks out this repository means
          # running whatever x/vuln publishes tomorrow — a small risk, and the
          # only unpinned Go dependency left here.
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          "$(go env GOPATH)/bin/govulncheck" ./...
        working-directory: server

      # govulncheck loads packages, which for this module means compiling
      # against a windowing stack. Without these it fails on cgo rather than on
      # anything it was asked to look for — "Package gl was not found", from a
      # job that never mentions graphics.
      - name: Toolkit dependencies
        run: tools/linux-gui-deps.sh

      # The rescue tool is a second Go module and a much larger dependency
      # tree — a GUI toolkit rather than net/http and crypto — so it is the one
      # more likely to be the subject of an advisory, not less. It is also the
      # program that opens vaults, which makes leaving it unscanned the wrong
      # way round. It found four on its first run.
      - name: govulncheck (rescue tool)
        run: "$(go env GOPATH)/bin/govulncheck ./..."
        working-directory: rescue

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.6'
          cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      # Semgrep is a gate because the repository passes it clean today, so any
      # finding from here on is signal rather than a backlog to argue with.
      #
      # p/trailofbits is deliberately not included: its one hit is the TrueNAS
      # compose file binding 8788 on all interfaces, which is the documented
      # deployment and would need a permanent ignore to keep quiet.
      - name: semgrep
        run: |
          pip install --quiet semgrep
          semgrep --metrics=off --error             --config=p/golang --config=p/security-audit --config=p/secrets             rescue server
          semgrep --metrics=off --error             --config=p/javascript --config=p/security-audit --config=p/secrets             --exclude=src/vendor             src test tools

      # gosec at high/high only, and the threshold is the point rather than a
      # convenience. At its defaults it reports ten things here of which nine
      # are noise — deliberate byte extraction from colour constants, an
      # ignored Close on a read path, opening the very file the user named —
      # and a gate that is nine parts noise is a gate people learn to force
      # through. This catches the flagrant and admits it catches little else.
      - name: gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0
          for module in rescue server; do
            (cd "$module" && "$(go env GOPATH)/bin/gosec" -severity high -confidence high -quiet ./...)
          done

  npm-audit:
    name: npm dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      # Only the runtime tree can reach a user. Everything else in the lockfile
      # belongs to web-ext and never leaves this machine, so a vulnerability
      # there is worth knowing and is not worth failing a build over — see the
      # note on `npm audit` in README.md.
      - name: Runtime dependencies (fails on anything)
        run: npm audit --omit=dev --audit-level=low

      - name: Build dependencies (reported, does not fail)
        run: npm audit || true

  vendored:
    name: Vendored code matches its source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      # src/vendor/argon2.js is the one file in this repository where a silent
      # substitution would be catastrophic and invisible: it derives the key
      # that everything else is encrypted under. The lockfile pins hash-wasm by
      # integrity hash, so regenerating from it and diffing proves the vendored
      # copy is still what it claims to be.
      #
      # The country table has had this check since it was generated. The crypto
      # did not, which was the wrong way round.
      - name: Argon2 has not drifted from the locked dependency
        run: |
          tools/vendor.sh
          git diff --exit-code -- src/vendor/argon2.js

      - name: Country table is current
        run: node tools/gen-countries.mjs --check

  extension:
    name: Extension manifest and permissions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: web-ext lint
        run: npx web-ext lint --source-dir=src --self-hosted

      # A permission that nothing uses is worth catching the week it appears
      # rather than the week somebody reads the manifest and wonders. This
      # caught `nativeMessaging` outliving the native host it was added for.
      - name: Every requested permission is used
        run: node tools/check-permissions.mjs
