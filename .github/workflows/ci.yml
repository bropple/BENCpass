name: CI

# Everything that can be checked on any machine. The native hosts cannot, and
# live in hosts.yml — see the note there about what runner minutes cost.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Nothing here publishes anything. Stated rather than inherited, because the
# repository-wide default can be write-all and a workflow that runs the
# repository's own test scripts should not be holding a token that can push.
permissions:
  contents: read

jobs:
  test:
    name: tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      # Present because `npm test` builds and runs the real Go server for the
      # sync tests, not to test the server itself — server-image.yml does that,
      # and gates the published image on it. `cache: false` because the server
      # has no dependencies and so no go.sum for setup-go to key a cache on;
      # without this the step fails looking for one.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.6'
          cache: false

      - run: npm ci

      - name: npm test
        run: npm test

      - name: web-ext lint
        run: npx web-ext lint --source-dir=src --self-hosted

      # The country table is generated from ICU. This catches it drifting from
      # the Node in use, which would otherwise only show up as a checkout in
      # some country quietly failing to fill.
      - name: country table is current
        run: node tools/gen-countries.mjs --check

      - name: shell scripts parse
        run: for f in tools/*.sh hosts/*.sh; do sh -n "$f" || exit 1; done

      # `sh -n` is syntax only — it accepts `rm -rf $UNSET/important` without
      # complaint. These scripts start browsers and servers and delete
      # directories, and the one bug that mattered in them (cleanup handlers
      # killing web-ext while the browser it detached kept running) was a
      # logic error that parsed perfectly.
      # The model test across eight seeds rather than the one `npm test` uses.
      #
      # An audit measured what the single-seed default misses: reintroduce the
      # fast-forward resurrection guard or the merge-layer rollback report and
      # it stays green, while both fail within seconds once the seed varies.
      # A minute here is worth more than any other minute in this file.
      - name: Sync model, several seeds
        run: npm run test:model
        env:
          MODEL_CASES: '2000'

      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck --severity=warning tools/*.sh hosts/*.sh

      # The manifest is what users see and what Firefox orders updates by. It
      # said 0.10.3 while package.json said 0.1.0, and had done for most of the
      # project's life.
      - name: one version, agreed
        run: node tools/check-version.mjs

      # The shipped artefact. CI linted the source and never once produced the
      # thing people install, so nothing proved it could be built at all.
      - name: build the extension
        run: npx web-ext build --source-dir=src --artifacts-dir=build/ext --overwrite-dest

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bencpass-extension
          path: build/ext/*.zip
          if-no-files-found: error
