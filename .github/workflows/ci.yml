name: CI

# The native hosts are the reason this exists. Everything else here can be run
# on any machine; the macOS host needs a Mac with the Swift toolchain and the
# Windows host needs Windows, and neither can be compiled where the rest of the
# work happens. A runner per platform turns "this ought to compile" into a fact.
#
# Note for a private repository: Linux minutes are cheap, macOS minutes count
# tenfold and Windows twofold against the same allowance. The host jobs are
# therefore scoped by `paths` — they run when a host or its build script
# changes, and not for every commit touching the extension.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: server/go.sum

      - run: npm ci

      # The sync tests build and run the real Go server rather than a stub, so
      # the toolchain above is not optional for a full run.
      - name: npm test
        run: npm test

      - name: go test
        run: go test ./...
        working-directory: server

      - name: web-ext lint
        run: npx web-ext lint --source-dir=src --self-hosted

      # The country table is generated from ICU. This catches it drifting from
      # the Node in use, which would otherwise only show up as a checkout in
      # some country quietly failing to fill.
      - name: country table is current
        run: node tools/gen-countries.mjs --check

      - name: shell scripts parse
        run: for f in tools/*.sh hosts/*.sh; do sh -n "$f" || exit 1; done

  macos-host:
    name: macOS host compiles
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # No test can be run here — Touch ID needs hardware and a person, and a
      # runner has neither. What this proves is that the Swift compiles against
      # the real LocalAuthentication and Security frameworks, which is the half
      # that cannot be checked anywhere else.
      - name: build
        run: swiftc -O -o /tmp/bencpass-auth hosts/macos/main.swift

      - name: ad-hoc sign
        run: codesign --force --sign - /tmp/bencpass-auth

      # It should answer `hello` without a keystore or a fingerprint, and report
      # biometrics: none on a machine that has none — which a runner is. That
      # exercises the framing, the JSON and the dispatch.
      - name: answers hello
        run: |
          python3 - <<'PY' > /tmp/request.bin
          import json, struct, sys
          body = json.dumps({"v": 1, "op": "hello"}).encode()
          sys.stdout.buffer.write(struct.pack("<I", len(body)) + body)
          PY
          /tmp/bencpass-auth < /tmp/request.bin > /tmp/reply.bin
          python3 - <<'PY'
          import json, struct
          data = open("/tmp/reply.bin", "rb").read()
          length = struct.unpack("<I", data[:4])[0]
          reply = json.loads(data[4:4 + length])
          print(reply)
          assert reply["ok"] is True, reply
          assert reply["platform"] == "macos", reply
          assert reply["biometrics"] == "none", "a runner has no Touch ID"
          PY
