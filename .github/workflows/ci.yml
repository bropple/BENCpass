name: CI

# Everything that can be checked on any machine. The native hosts cannot, and
# live in hosts.yml — see the note there about what runner minutes cost.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Present because `npm test` builds and runs the real Go server for the
      # sync tests, not to test the server itself — server-image.yml does that,
      # and gates the published image on it. `cache: false` because the server
      # has no dependencies and so no go.sum for setup-go to key a cache on;
      # without this the step fails looking for one.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: false

      - run: npm ci

      - name: npm test
        run: npm test

      - name: web-ext lint
        run: npx web-ext lint --source-dir=src --self-hosted

      # The country table is generated from ICU. This catches it drifting from
      # the Node in use, which would otherwise only show up as a checkout in
      # some country quietly failing to fill.
      - name: country table is current
        run: node tools/gen-countries.mjs --check

      - name: shell scripts parse
        run: for f in tools/*.sh hosts/*.sh; do sh -n "$f" || exit 1; done
