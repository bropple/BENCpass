name: Native hosts

# The macOS host needs a Mac with the Swift toolchain and the Windows host will
# need Windows, and neither can be compiled where the rest of this work happens.
# A runner per platform turns "this ought to compile" into a fact.
#
# Separate from ci.yml because of what these cost. On a private repository macOS
# minutes count tenfold against the allowance and Windows twofold, so this runs
# when a host or its build script changes rather than on every commit that
# touches the extension. `paths` is a trigger filter, and a trigger belongs to a
# workflow rather than a job — which is the whole reason this is its own file.

on:
  push:
    branches: [main]
    paths:
      - 'hosts/**'
      - '.github/workflows/hosts.yml'
  pull_request:
    paths:
      - 'hosts/**'
      - '.github/workflows/hosts.yml'
  workflow_dispatch:

jobs:
  macos-host:
    name: macOS host compiles
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # No test can be run here — Touch ID needs hardware and a person, and a
      # runner has neither. What this proves is that the Swift compiles against
      # the real LocalAuthentication and Security frameworks, which is the half
      # that cannot be checked anywhere else.
      - name: build
        run: swiftc -O -o /tmp/bencpass-auth hosts/macos/main.swift

      - name: ad-hoc sign
        run: codesign --force --sign - /tmp/bencpass-auth

      # It should answer `hello` without a keystore or a fingerprint, and report
      # biometrics: none on a machine that has none — which a runner is. That
      # exercises the framing, the JSON and the dispatch.
      - name: answers hello
        run: |
          python3 - <<'PY' > /tmp/request.bin
          import json, struct, sys
          body = json.dumps({"v": 1, "op": "hello"}).encode()
          sys.stdout.buffer.write(struct.pack("<I", len(body)) + body)
          PY
          /tmp/bencpass-auth < /tmp/request.bin > /tmp/reply.bin
          python3 - <<'PY'
          import json, struct
          data = open("/tmp/reply.bin", "rb").read()
          length = struct.unpack("<I", data[:4])[0]
          reply = json.loads(data[4:4 + length])
          print(reply)
          assert reply["ok"] is True, reply
          assert reply["platform"] == "macos", reply
          assert reply["biometrics"] == "none", "a runner has no Touch ID"
          PY

      # ---- the keychain experiment ----------------------------------------
      #
      # A biometric keychain item is refused with -34018 (errSecMissingEntitlement)
      # unless the signature claims a keychain access group. Which signature
      # satisfies that is a fact about macOS, not about the Swift, so it is
      # measured here rather than reasoned about: sign three ways, ask each one,
      # print what came back.
      #
      # SecItemAdd does not prompt — the constraint is evaluated when the item is
      # read — so a runner with no fingerprint reader can answer this.
      - name: which signature can write a biometric keychain item
        run: |
          probe() {
            python3 - <<'PY' > /tmp/probe.bin
          import json, struct, sys
          body = json.dumps({"v": 1, "op": "probe"}).encode()
          sys.stdout.buffer.write(struct.pack("<I", len(body)) + body)
          PY
            /tmp/bencpass-auth < /tmp/probe.bin > /tmp/probe-reply.bin || echo "  (host exited non-zero)"
            python3 - <<'PY'
          import json, struct
          data = open("/tmp/probe-reply.bin", "rb").read()
          if len(data) < 4:
              print("  no reply")
          else:
              n = struct.unpack("<I", data[:4])[0]
              r = json.loads(data[4:4 + n])
              print("  access control:", r.get("accessControl"), " biometrics:", r.get("biometrics"))
              for keychain, status in sorted(r.get("results", {}).items()):
                  note = " <- errSecMissingEntitlement" if status == -34018 else ""
                  print(f"  {keychain:16} {status}{note}")
          PY
          }

          echo "== ad-hoc, no entitlements =="
          codesign --force --sign - /tmp/bencpass-auth
          probe

          echo "== ad-hoc, keychain-access-groups with a named group =="
          codesign --force --sign - \
            --entitlements hosts/macos/bencpass-auth.entitlements /tmp/bencpass-auth
          probe

          echo "== ad-hoc, keychain-access-groups empty =="
          cat > /tmp/empty.entitlements <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <plist version="1.0">
          <dict><key>keychain-access-groups</key><array/></dict>
          </plist>
          PLIST
          codesign --force --sign - --entitlements /tmp/empty.entitlements /tmp/bencpass-auth
          probe

          echo
          echo "Reported, not asserted. 0 means that signature can write the item."
